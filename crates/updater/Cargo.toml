[package]
name = "jarvis-updater"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
base64 = "0.22"
minisign-verify = "0.3"
sha2 = "0.10"
url = "2"

[features]
provision = ["dep:minisign", "dep:keyring", "dep:uuid"]

[dependencies.minisign]
version = "0.10"
optional = true

[dependencies.uuid]
version = "1"
features = ["v4"]
optional = true

[target.'cfg(windows)'.dependencies.keyring]
version = "3"
features = ["windows-native"]
optional = true

[dev-dependencies]
minisign = "0.10"
