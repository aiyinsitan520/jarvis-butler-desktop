name: desktop packages
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            config: ''
            bundles: nsis
          - os: macos-latest
            target: aarch64-apple-darwin
            config: '--config apps/desktop/src-tauri/tauri.macos.conf.json'
            bundles: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.target }}
      - run: npm ci
      - run: npm test
      - run: cargo test -p jarvis-workspace --locked -- --test-threads=1
      - run: cargo test -p jarvis-desktop --lib --locked -- --test-threads=1
      - run: node scripts/licenses.mjs --check
      - run: node scripts/audit-release.mjs
      - name: Build installer
        run: npx tauri build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} ${{ matrix.config }}
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Checksums
        run: |
          mkdir -p release-assets
          find packages -type f \( -name '*.exe' -o -name '*.dmg' \) -exec cp {} release-assets/ \;
          (cd release-assets && sha256sum *) > SHA256SUMS.txt
      - name: Publish testing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --prerelease --title "贾维斯管家 $GITHUB_REF_NAME（测试版）" --notes-file docs/release-notes.md release-assets/* SHA256SUMS.txt LICENSE THIRD_PARTY_LICENSES.md
